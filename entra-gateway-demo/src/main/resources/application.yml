server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: backend
              uri: http://localhost:9090
              predicates:
                - Path=/**
              filters:
                - TokenRelay=

  security:
    oauth2:
      client:
        registration:
          entra:
            client-id: ""
            client-secret: ""
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            # Must match a Redirect URI registered on the Entra app.
            redirect-uri: "{baseUrl}/login/oauth2/code/entra"
        provider:
          entra:
            issuer-uri: ""

# Experiment: an Entra-authenticated but app-unprovisioned user gets 400 on this endpoint,
# which crashes the SPA. Present it as 401 so the SPA runs its own redirect-to-login handling.
# Set enabled=false (or override via -Didd.gateway.no-access.enabled=false) to turn it off
# without a rebuild.
idd:
  gateway:
    no-access:
      enabled: true
      path: /common/customer
      from-status: 400
      to-status: 401

logging:
  level:
    "[org.springframework.security]": DEBUG
    "[org.springframework.cloud.gateway]": DEBUG
